services:
  db:
    image: postgres:15-alpine
    container_name: disagro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: disagro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - disagro_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disagro_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/disagro_db
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - disagro_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disagro_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - disagro_network

volumes:
  postgres_data:

networks:
  disagro_network:
    driver: bridge